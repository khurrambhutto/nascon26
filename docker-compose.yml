services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon-local
      POSTGRES_DB: nascon
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon -d nascon"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  object-store:
    image: bitnamilegacy/minio:2024.9.22
    environment:
      MINIO_ROOT_USER: nascon-storage
      MINIO_ROOT_PASSWORD: nascon-storage-local
    volumes: ["object-data:/bitnami/minio/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    ports: ["8080:8080"]
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://nascon:nascon-local@db:5432/nascon
      REDIS_URL: redis://redis:6379/0
      DAY1_SALT: ${DAY1_SALT}
      JWT_SECRET: ${JWT_SECRET:-nascon-local-development-secret-change-for-deployment}
      OBJECT_STORE_URL: http://object-store:9000
      OBJECT_STORE_ACCESS_KEY: nascon-storage
      OBJECT_STORE_SECRET_KEY: nascon-storage-local
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      object-store: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
  object-data:
