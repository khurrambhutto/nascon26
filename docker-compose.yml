services:
  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon-local
      POSTGRES_DB: nascon
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon -d nascon"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  object-store:
    image: bitnamilegacy/minio:2024.9.22
    environment:
      MINIO_ROOT_USER: nascon-storage
      MINIO_ROOT_PASSWORD: nascon-storage-local
    volumes: ["object-data:/bitnami/minio/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    # 4 workers for NFR-2 (550 concurrent VUs); shared state lives in PostgreSQL and Redis.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "4"]
    ports: ["8080:8080"]
    networks:
      default:
        aliases: [backend]  # Selenium nodes may reach the API as http://backend:8080
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://nascon:nascon-local@db:5432/nascon
      REDIS_URL: redis://redis:6379/0
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT}
      MEDIA_API_URL: http://media:9997
      JWT_SECRET: ${JWT_SECRET:-}
      OBJECT_STORE_URL: http://object-store:9000
      OBJECT_STORE_ACCESS_KEY: nascon-storage
      OBJECT_STORE_SECRET_KEY: nascon-storage-local
      SMTP_DELIVERY_MODE: ${SMTP_DELIVERY_MODE:-local}
      SMTP_HOST: ${SMTP_HOST:-local-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-receipts@arenaone.local}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-none}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
      DEMO_RECEIPT_EMAIL: ${DEMO_RECEIPT_EMAIL:-}
    depends_on:
      local-mail: {condition: service_healthy}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      object-store: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes: ["recordings:/recordings"]
    depends_on:
      api: {condition: service_healthy}
      local-mail: {condition: service_healthy}
  local-mail:
    build: ./backend
    command: ["python", "-m", "app.local_smtp"]
    environment: *backend-env
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',1025),2); assert s.recv(256).startswith(b'220'); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 20
  media:
    image: bluenviron/mediamtx:1.9.1
    ports: ["1935:1935", "8888:8888", "8889:8889", "8189:8189/udp"]
    environment:
      MTX_API: "yes"
      MTX_AUTHMETHOD: http
      MTX_AUTHHTTPADDRESS: http://api:8080/internal/media/auth
      MTX_PATHDEFAULTS_RECORD: "yes"
      MTX_PATHDEFAULTS_RECORDPATH: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    volumes: ["recordings:/recordings"]
  selenium-hub:
    image: selenium/hub:4.24.0
    container_name: nascon-selenium-hub
    ports: ["4442:4442", "4443:4443", "4444:4444"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 30
  node-chrome-1: &browser-node
    image: selenium/node-chrome:4.24.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment: &node-env
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_NODE_MAX_SESSIONS: "2"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_START_VNC: "false"
  node-chrome-2: *browser-node
  node-firefox:
    <<: *browser-node
    image: selenium/node-firefox:4.24.0
volumes:
  recordings:
  postgres-data:
  object-data:
